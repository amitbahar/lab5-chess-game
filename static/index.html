<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess workshop</title><link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <div class="layout">
      <section class="frame" aria-label="Chess board"><div id="board"></div></section>
      <dialog id="promotion" aria-label="Choose a piece to promote to">
        <form method="dialog"><p>Promote to</p><div id="promotion-choices"></div></form>
      </dialog>
      <aside>
        <h2 id="turn">White to move</h2>
        <p id="message" role="status" aria-live="polite"></p>
        <div id="controls">
          <button data-action="new" data-opponent="human">New game: two players</button>
          <button data-action="new" data-opponent="computer">New game: play the computer</button>
          <button data-action="undo" id="undo">Undo move</button>
        </div>
        <h3><label for="save-name">Saved game</label></h3>
        <div id="file-controls">
          <input id="save-name" value="game" maxlength="64" pattern="[A-Za-z0-9_\-]+"
                 list="saved-games" autocomplete="off" spellcheck="false"
                 aria-describedby="save-hint">
          <datalist id="saved-games"></datalist>
          <button data-action="save">Save</button>
          <button data-action="load">Load</button>
        </div>
        <p id="save-hint">Letters, digits, - and _. Saved as <i>name</i>.save.json.</p>
        <section id="captured-panel" hidden><h3>Captured pieces</h3><p id="captured"></p></section>
        <h3>Moves</h3><ol id="moves"></ol>
      </aside>
    </div>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
